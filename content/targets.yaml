# What `overcount generate` asks Gemini for, in order. Each target becomes one family:
# a root problem (easy) plus `variants` (medium, then hard). Finished targets are skipped.
# Order: the pilot methods (stars-and-bars, derangements, symmetry-relative-order), the three
# family-v1 regenerations, the other 16 methods, then probability targets parked for later.
# Generated by a one-off script; edit freely.

targets:
