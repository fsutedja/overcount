<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Overcount</title>
    <script>
      // Apply the saved theme (or the system setting) before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('overcount.theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta name="description" content="Practice combinatorics and probability one decision at a time." />
    <!-- Link previews (LinkedIn, Slack, iMessage, X). The image is web/public/og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Overcount" />
    <meta property="og:title" content="Overcount: combinatorics and probability practice" />
    <meta property="og:description" content="Practice combinatorics and probability one decision at a time. Answer freely, fill in the blanks, then see why." />
    <meta property="og:url" content="https://overcount.vercel.app/" />
    <meta property="og:image" content="https://overcount.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Overcount problem page: a counting problem with an example diagram and an answer box." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
